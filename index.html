<style>

<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo"><img src="./logo-fpinventory.jpeg" alt="Logo FPinventory"></div>
      <h1>Inventário Pro</h1>
      <p>Entre para acessar as empresas e inventários vinculados à sua conta.</p>
      <button id="googleLoginBtn" class="btn google-btn" type="button"><span>G</span> Continuar com Google</button>
      <div class="auth-divider">ou use e-mail e senha</div>
      <form id="authForm" class="auth-form">
        <input id="authName" autocomplete="name" placeholder="Seu nome" class="hidden">
        <input id="authEmail" type="email" autocomplete="email" required placeholder="E-mail">
        <input id="authPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="Senha (mínimo 6 caracteres)">
        <button id="authSubmit" class="btn" type="submit">Entrar</button>
      </form>
      <div id="authStatus" class="auth-status"></div>
      <div class="auth-switch"><span id="authSwitchText">Ainda não tem conta?</span> <button id="authModeBtn" type="button">Criar conta</button></div>
    </div>
  </section>
  <section id="onboardingScreen" class="onboarding hidden">
    <div class="card">
      <h2>Cadastre sua primeira empresa</h2>
      <p class="row-sub">Você será o administrador e poderá adicionar operadores depois.</p>
      <form id="companyForm" class="form-grid">
        <label>Nome da empresa<input id="companyName" required minlength="2" maxlength="120" placeholder="Ex.: Loja Centro"></label>
        <label>CNPJ/Documento (opcional)<input id="companyDocument" maxlength="40" placeholder="Somente para identificação"></label>
        <div class="actions"><button id="onboardingLogout" type="button" class="ghost">Sair</button><button class="btn">Criar empresa</button></div>
      </form>
      <div id="companyStatus" class="auth-status"></div>
    </div>
  </section>
  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div class="brand-title"><div class="header-logo"><img src="./logo-fpinventory.jpeg" alt="Logo FPinventory"></div><div><div class="eyebrow">GESTÃO DE INVENTÁRIO</div><h1>Inventário Pro</h1></div></div>
      <div class="header-actions"><span id="userChip" class="user-chip"></span><button id="installBtn" class="ghost hidden">Instalar</button><button id="logoutBtn" class="mini">Sair</button></div>
    </header>
    <div class="company-bar"><select id="companySelect" aria-label="Empresa ativa"></select><button id="storesBtn" class="mini hidden">Lojas e auditoria</button><button id="plansBtn" class="mini">Planos</button><button id="usagePanelBtn" class="mini">Painel</button><button id="manageCompanyBtn" class="mini">Usuários</button></div>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-view="dashboard" class="nav-item active"><span>⌂</span><small>Início</small></button>
      <button data-view="estoque" class="nav-item"><span>▤</span><small>Estoque</small></button>
      <button data-view="produtos" class="nav-item"><span>▦</span><small>Produtos</small></button>
      <button data-view="listas" class="nav-item"><span>☷</span><small>Listas</small></button>
      <button data-view="contagens" class="nav-item"><span>✓</span><small>Contagens</small></button>
      <button data-view="guia" class="nav-item"><span>?</span><small>Guia</small></button>
    </nav>
  </div>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <input id="csvInput" type="file" accept=".csv,text/csv" hidden />
  <input id="erpInput" type="file" accept=".csv,text/csv" hidden />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>

  <script>const DB_KEY_BASE='inventario_pro_v2';
let DB_KEY=DB_KEY_BASE;
const SUPABASE_URL='https://nplsfimbwowdatmlesaa.supabase.co';
const SUPABASE_KEY='sb_publishable_jnadulE_X2FHduAH1_wK8g_aPkcvF0Y';
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const uid=()=>crypto.randomUUID();
const now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const num=v=>Number(String(v??'').replace(',','.'))||0;
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtQty=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const papelNome=p=>p==='admin'?'Administrador':p==='contador'?'Contador':p==='auditor'?'Auditor':'Operador';

function initialData(){
  const c1={id:uid(),erp_id:'CAT-01',nome:'Mercearia',ativo:true,criado_em:now(),atualizado_em:now()};
  const c2={id:uid(),erp_id:'CAT-02',nome:'Bebidas',ativo:true,criado_em:now(),atualizado_em:now()};
  const p1={id:uid(),erp_id:'1001',codigo:'ARZ-001',nome:'Arroz 5kg',descricao:'Pacote 5kg',unidade:'UN',categoria_id:c1.id,estoque_atual:18,estoque_minimo:10,custo:22.9,preco:31.9,localizacao:'A-01-01',ativo:true,criado_em:now(),atualizado_em:now()};
  const p2={id:uid(),erp_id:'1002',codigo:'FEJ-001',nome:'Feijão 1kg',descricao:'Tipo 1',unidade:'UN',categoria_id:c1.id,estoque_atual:6,estoque_minimo:8,custo:5.8,preco:8.99,localizacao:'A-01-02',ativo:true,criado_em:now(),atualizado_em:now()};
  const p3={id:uid(),erp_id:'2001',codigo:'REF-002',nome:'Refrigerante 2L',descricao:'Garrafa PET',unidade:'UN',categoria_id:c2.id,estoque_atual:42,estoque_minimo:12,custo:6.2,preco:9.9,localizacao:'B-03-01',ativo:true,criado_em:now(),atualizado_em:now()};
  return {categorias:[c1,c2],produtos:[p1,p2,p3],lojas:[],listas:[],contagens:[],movimentos:[],importacoes:[]};
}
let db=initialData();
db.categorias ||= []; db.movimentos ||= []; db.importacoes ||= [];
let view='dashboard', deferredPrompt=null;
const main=document.getElementById('main'), modal=document.getElementById('modal'), modalBody=document.getElementById('modalBody');
const csvInput=document.getElementById('csvInput'), erpInput=document.getElementById('erpInput');
const authScreen=document.getElementById('authScreen'), onboardingScreen=document.getElementById('onboardingScreen'), appShell=document.getElementById('appShell');
const companySelect=document.getElementById('companySelect'), manageCompanyBtn=document.getElementById('manageCompanyBtn'), usagePanelBtn=document.getElementById('usagePanelBtn'), plansBtn=document.getElementById('plansBtn'), storesBtn=document.getElementById('storesBtn');
let authMode='login', currentUser=null, memberships=[], activeMembership=null, activePlan={codigo:'free',nome:'Grátis',limite_usuarios:2,limite_produtos:100,limite_inventarios_mes:2,recursos:{csv:true}};
function save(renderNow=true){localStorage.setItem(DB_KEY,JSON.stringify(db));if(renderNow)render()}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function closeModal(){modal.close();modalBody.innerHTML=''}
function openModal(html){modalBody.innerHTML=html;if(!modal.open)modal.showModal()}
function setView(v){const papel=activeMembership?.papel;if(['contador','auditor'].includes(papel)&&!['produtos','listas','contagens'].includes(v))v='listas';view=v;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();registrarUso('navegacao',{tela:v})}
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function catName(id){return db.categorias.find(c=>c.id===id)?.nome||'Sem categoria'}
function empresarial(){return activePlan?.recursos?.multiloja===true}
function lojaName(id){return db.lojas?.find(l=>l.id===id)?.nome||'Loja Matriz'}
function ensureLojas(){db.lojas||=[];if(empresarial()&&!db.lojas.length)db.lojas.push({id:uid(),nome:'Loja Matriz',codigo:'MATRIZ',localizacao:'',ativo:true,criado_em:now()});if(empresarial()){const matriz=db.lojas[0]?.id;db.produtos.forEach(p=>p.loja_id||=(matriz||''));db.listas.forEach(l=>l.loja_id||=(matriz||''))}}
function lojaSelect(name,value='',todos=false){return `<select name="${name}" id="${name}">${todos?'<option value="">Todas as lojas</option>':''}${(db.lojas||[]).filter(l=>l.ativo).map(l=>`<option value="${l.id}" ${l.id===value?'selected':''}>${esc(l.nome)}</option>`).join('')}</select>`}
function stockStatus(p){if(!p.ativo)return ['Inativo','']; if(num(p.estoque_atual)<=0)return ['Sem estoque','danger']; if(num(p.estoque_atual)<num(p.estoque_minimo))return ['Baixo','warn']; return ['OK','ok']}

function dashboard(){
 const abertas=db.contagens.filter(c=>c.status==='aberta').length, concluidas=db.contagens.filter(c=>c.status==='finalizada').length;
 const baixos=db.produtos.filter(p=>p.ativo&&num(p.estoque_atual)<num(p.estoque_minimo)).length;
 const valor=db.produtos.reduce((s,p)=>s+num(p.estoque_atual)*num(p.custo),0);
 const grupos=(chave)=>{const mapa={};db.produtos.filter(p=>p.ativo).forEach(p=>{const nome=chave(p)||'Não informado';mapa[nome]=(mapa[nome]||0)+num(p.estoque_atual)*num(p.custo)});return Object.entries(mapa).sort((a,b)=>b[1]-a[1])};
 const porCategoria=grupos(p=>catName(p.categoria_id)),porSetor=grupos(p=>p.setor||String(p.localizacao||'').split('-')[0]||'Não informado');
 const ranking=(items)=>{const max=Math.max(1,...items.map(x=>x[1]));return items.slice(0,6).map(([nome,total])=>`<div class="rank-item"><div class="rank-head"><b>${esc(nome)}</b><span>${money(total)}</span></div><div class="rank-track"><div class="rank-fill" style="width:${Math.max(3,Math.round(total/max*100))}%"></div></div></div>`).join('')||'<div class="empty">Sem dados.</div>'};
 return `<section class="hero"><div class="hero-kicker">VISÃO OPERACIONAL</div><h2>Inventário e estoque em um só fluxo.</h2><p>Importe o ERP, monitore saldos, monte listas e execute contagens com rastreabilidade.</p></section>
 <div class="grid"><div class="card metric"><strong>${db.produtos.length}</strong><span>Produtos</span></div><div class="card metric"><strong>${baixos}</strong><span>Estoque baixo</span></div><div class="card metric"><strong>${abertas}</strong><span>Em contagem</span></div><div class="card metric"><strong>${money(valor)}</strong><span>Valor em custo</span></div></div>
 <div class="section-head"><h2>Atalhos</h2></div><div class="grid action-grid"><button class="card clickable" onclick="setView('estoque')"><b>▤ Estoque</b><div class="row-sub">Saldos e alertas</div></button><button class="card clickable" onclick="document.getElementById('erpInput').click()"><b>⇄ Importar ERP</b><div class="row-sub">CSV com upsert</div></button><button class="card clickable" onclick="novoProduto()"><b>+ Produto</b><div class="row-sub">CRUD manual</div></button><button class="card clickable" onclick="novaLista()"><b>+ Lista</b><div class="row-sub">Preparar inventário</div></button><button class="card clickable" onclick="abrirSincronizacao()"><b>⟳ Sincronizar banco</b><div class="row-sub">Contagens e estoque atualizados</div></button></div>
 <div class="section-head"><h2>Valor do estoque</h2><span class="row-sub">Custo por agrupamento</span></div><div class="dash-columns"><div class="card"><h3>Por categoria</h3><div class="rank-list">${ranking(porCategoria)}</div></div><div class="card"><h3>Por setor</h3><div class="rank-list">${ranking(porSetor)}</div></div></div>
 ${baixos?`<div class="section-head"><h2>Atenção necessária</h2></div><div class="alert-card"><b>${baixos} produto(s) abaixo do estoque mínimo.</b><button class="ghost" onclick="setView('estoque')">Ver estoque</button></div>`:''}
 <section class="card about-site" aria-labelledby="sobre-inventario-pro"><div class="eyebrow">SOBRE O SITE</div><h2 id="sobre-inventario-pro">Inventário Pro · FP Inventários</h2><p>Plataforma para importar produtos, organizar estoques e listas, realizar contagens e acompanhar divergências com relatórios.</p><p class="about-founder"><b>Fundador:</b> Felipe Pereira Andrade · Analista de Prevenção de Perdas e Desenvolvedor.</p><small>FP Inventários · Soluções práticas para controle e conferência de estoque.</small></section>`
}

function estoque(){
 const totalQty=db.produtos.reduce((s,p)=>s+num(p.estoque_atual),0), totalCost=db.produtos.reduce((s,p)=>s+num(p.estoque_atual)*num(p.custo),0);
 const low=db.produtos.filter(p=>p.ativo&&num(p.estoque_atual)<num(p.estoque_minimo)).length;
 return `<div class="section-head"><div><h2>Estoque</h2><div class="row-sub">Saldo atual consolidado</div></div><button class="btn" onclick="document.getElementById('erpInput').click()">Importar ERP</button></div>
 <div class="stats-strip"><div><b>${fmtQty(totalQty)}</b><span>Unidades</span></div><div><b>${money(totalCost)}</b><span>Valor custo</span></div><div><b>${low}</b><span>Abaixo do mínimo</span></div></div>
 <div class="toolbar"><button class="ghost" onclick="exportEstoqueCSV()">Exportar CSV</button><button class="ghost" onclick="exportEstoqueExcel()">Exportar Excel</button><button class="ghost" onclick="gerenciarCategorias()">Categorias</button></div>
 <div class="filter-row"><input class="search" id="stockSearch" placeholder="SKU, produto, categoria ou localização" oninput="renderStockFiltered()"><select id="stockFilter" onchange="renderStockFiltered()"><option value="all">Todos</option><option value="low">Estoque baixo</option><option value="zero">Sem estoque</option><option value="active">Ativos</option></select>${empresarial()?lojaSelect('stockStore','',true).replace('<select ','<select onchange="renderStockFiltered()" '):''}</div>

}

window.abrirSincronizacao=async()=>{
 openModal('<h2>Sincronizar com o banco</h2><div class="empty">Verificando a versão salva...</div>');
 const {data,error}=await supa.from('inventario_sincronizacao').select('dados,atualizado_em,atualizado_por').eq('empresa_id',activeMembership.empresa_id).maybeSingle();
 if(error){modalBody.innerHTML=`<h2>Sincronizar com o banco</h2><div class="alert-card"><b>Não foi possível consultar o banco.</b></div><p class="note">${esc(error.message)}</p><div class="actions"><button class="ghost" onclick="closeModal()">Fechar</button></div>`;return}
 const remoto=data?.dados||null,produtos=Array.isArray(remoto?.produtos)?remoto.produtos.length:0,contagens=Array.isArray(remoto?.contagens)?remoto.contagens.length:0;
 modalBody.innerHTML=`<h2>Sincronizar com o banco</h2><p class="row-sub">Escolha a direção da sincronização para evitar substituir informações por engano.</p><div class="stats-strip" style="margin-top:16px"><div><b>${db.produtos.length}</b><span>Produtos neste aparelho</span></div><div><b>${db.contagens.length}</b><span>Contagens neste aparelho</span></div><div><b>${data?new Date(data.atualizado_em).toLocaleString('pt-BR'):'Nunca'}</b><span>Última versão no banco</span></div></div>${data?`<div class="note" style="margin-top:14px">No banco: ${produtos} produto(s) e ${contagens} contagem(ns).</div>`:'<div class="note" style="margin-top:14px">Ainda não existe uma cópia desta empresa no banco.</div>'}<div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button>${data?'<button class="ghost" onclick="baixarSincronizacao()">Baixar do banco</button>':''}<button class="btn" onclick="enviarSincronizacao()">Enviar dados atuais</button></div>`;
};
window.enviarSincronizacao=async()=>{
 if(!confirm('Enviar os dados atuais para o banco? A versão anterior da empresa será substituída.'))return;
 const payload=JSON.parse(JSON.stringify(db));
 const {error}=await supa.from('inventario_sincronizacao').upsert({empresa_id:activeMembership.empresa_id,dados:payload,atualizado_em:now(),atualizado_por:currentUser.id},{onConflict:'empresa_id'});
 if(error){toast('Falha ao enviar: '+error.message);return}
 registrarUso('sincronizacao_enviada',{produtos:db.produtos.length,contagens:db.contagens.length});closeModal();toast('Dados enviados e contagens atualizadas no banco')
};
window.baixarSincronizacao=async()=>{
 if(!confirm('Baixar a versão do banco? Os dados deste aparelho serão substituídos.'))return;
 const {data,error}=await supa.from('inventario_sincronizacao').select('dados,atualizado_em').eq('empresa_id',activeMembership.empresa_id).maybeSingle();
 if(error||!data?.dados){toast(error?'Falha ao baixar: '+error.message:'Nenhuma versão encontrada no banco');return}
 const remoto=data.dados;if(!Array.isArray(remoto.produtos)||!Array.isArray(remoto.contagens)||!Array.isArray(remoto.listas)){toast('A versão do banco está incompleta e não foi aplicada');return}
 db={...initialData(),...remoto};db.categorias||=[];db.produtos||=[];db.lojas||=[];db.listas||=[];db.contagens||=[];db.movimentos||=[];db.importacoes||=[];save(false);registrarUso('sincronizacao_baixada',{produtos:db.produtos.length,contagens:db.contagens.length});closeModal();render();toast('Dados do banco carregados neste aparelho')
};
function stockRows(items){return items.length?items.map(p=>{const [label,cls]=stockStatus(p);return `<div class="stock-row"><div class="stock-main"><div class="stock-icon">${esc((p.nome||'?')[0])}</div><div><div class="row-title">${esc(p.nome)}</div><div class="row-sub">${esc(p.codigo||'Sem SKU')} • ${esc(catName(p.categoria_id))} • ${esc(p.localizacao||'Sem local')}${empresarial()?` • ${esc(lojaName(p.loja_id))}`:''}</div></div></div><div class="stock-right"><strong>${fmtQty(p.estoque_atual)} ${esc(p.unidade||'UN')}</strong><span class="badge ${cls}">${label}</span><button class="mini" onclick="editarProduto('${p.id}')">Editar</button></div></div>`}).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}
window.renderStockFiltered=()=>{const q=(document.getElementById('stockSearch')?.value||'').toLowerCase(), f=document.getElementById('stockFilter')?.value||'all',loja=document.getElementById('stockStore')?.value||'';let items=db.produtos.filter(p=>(`${p.codigo} ${p.nome} ${catName(p.categoria_id)} ${p.localizacao}`).toLowerCase().includes(q));if(loja)items=items.filter(p=>p.loja_id===loja);if(f==='low')items=items.filter(p=>p.ativo&&num(p.estoque_atual)<num(p.estoque_minimo));if(f==='zero')items=items.filter(p=>num(p.estoque_atual)<=0);if(f==='active')items=items.filter(p=>p.ativo);document.getElementById('stockList').innerHTML=stockRows(items)};

function produtos(){const restrito=['contador','auditor'].includes(activeMembership?.papel);return `<div class="section-head"><div><h2>Produtos</h2>${restrito?'<div class="row-sub">Consulta somente leitura</div>':''}</div>${restrito?'':`<div class="toolbar"><button class="ghost" onclick="document.getElementById('csvInput').click()">Importar CSV simples</button>${activeMembership?.papel==='admin'?'<button class="danger" onclick="abrirExclusaoProdutos()">Excluir produtos</button>':''}</div>`}</div><input class="search" id="searchProducts" placeholder="Buscar por nome ou código" oninput="renderProdutosFiltrados(this.value)"><div id="prodList" class="list">${productRows(db.produtos)}</div>${restrito?'':'<button class="fab" onclick="novoProduto()">+</button>'}`}
function productRows(items){const restrito=['contador','auditor'].includes(activeMembership?.papel);return items.length?items.map(p=>`<div class="row"><div class="row-main"><div class="row-title">${esc(p.nome)}</div><div class="row-sub">${esc(p.codigo||'Sem código')} • ${esc(catName(p.categoria_id))} • ${esc(p.unidade||'UN')}</div></div><div class="row-actions"><span class="badge ${p.ativo?'ok':''}">${p.ativo?'Ativo':'Inativo'}</span>${restrito?'':`<button class="mini" onclick="editarProduto('${p.id}')">Editar</button>`}</div></div>`).join(''):'<div class="empty">Nenhum produto cadastrado.</div>'}
window.renderProdutosFiltrados=q=>{const s=q.toLowerCase();document.getElementById('prodList').innerHTML=productRows(db.produtos.filter(p=>(p.nome+' '+(p.codigo||'')).toLowerCase().includes(s)))};
function productForm(p={}){return `<form id="produtoForm" data-id="${p.id||''}" class="form-grid">${empresarial()?`<label>Loja responsável${lojaSelect('loja_id',p.loja_id||db.lojas?.[0]?.id||'')}</label>`:''}<label>Nome<input name="nome" required maxlength="120" value="${esc(p.nome||'')}"></label><div class="two"><label>Código / SKU<input name="codigo" maxlength="60" value="${esc(p.codigo||'')}"></label><label>ID ERP<input name="erp_id" maxlength="80" value="${esc(p.erp_id||'')}"></label></div><div class="two"><label>Categoria existente<select name="categoria_id"><option value="">Sem categoria</option>${db.categorias.filter(c=>c.ativo).map(c=>`<option value="${c.id}" ${c.id===p.categoria_id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label>Adicionar nova categoria<input name="nova_categoria" maxlength="80" placeholder="Digite para criar ao salvar"></label></div><div class="two"><label>Setor<input name="setor" maxlength="80" value="${esc(p.setor||'')}" placeholder="Ex.: Depósito, Loja, Câmara fria"></label><label>Unidade<input name="unidade" value="${esc(p.unidade||'UN')}" maxlength="20"></label></div><div class="three"><label>Estoque atual<input name="estoque_atual" type="number" step="0.001" min="0" value="${p.estoque_atual??0}"></label><label>Estoque mínimo<input name="estoque_minimo" type="number" step="0.001" min="0" value="${p.estoque_minimo??0}"></label><label>Localização<input name="localizacao" value="${esc(p.localizacao||'')}"></label></div><div class="two"><label>Custo<input name="custo" type="number" step="0.01" min="0" value="${p.custo??0}"></label><label>Preço<input name="preco" type="number" step="0.01" min="0" value="${p.preco??0}"></label></div><label>Descrição<textarea name="descricao" rows="2">${esc(p.descricao||'')}</textarea></label><label class="switch-line"><input name="ativo" type="checkbox" ${p.ativo!==false?'checked':''}> Produto ativo</label><div class="actions">${p.id?`<button type="button" class="danger" onclick="excluirProduto('${p.id}')">Excluir</button>`:''}<button type="button" class="ghost" onclick="closeModal()">Cancelar</button><button class="btn">Salvar</button></div></form>`}
function limiteAtingido(tipo,atual,extra=1){const campo=tipo==='produtos'?'limite_produtos':'limite_inventarios_mes',limite=activePlan?.[campo];if(limite!==null&&limite!==undefined&&atual+extra>limite){toast(`Limite de ${limite} ${tipo} do plano ${activePlan.nome}. Faça upgrade em Planos.`);return true}return false}
function inventariosNoMes(){const inicio=new Date();inicio.setDate(1);inicio.setHours(0,0,0,0);return db.contagens.filter(c=>new Date(c.iniciado_em||c.criado_em||0)>=inicio).length}
window.novoProduto=()=>{if(['contador','auditor'].includes(activeMembership?.papel)){toast('Seu perfil não pode cadastrar produtos');return}if(limiteAtingido('produtos',db.produtos.length))return;openModal(`<h2>Novo produto</h2>${productForm()}`)};
window.editarProduto=id=>{if(['contador','auditor'].includes(activeMembership?.papel)){toast('Produtos disponíveis somente para consulta');return}const p=db.produtos.find(x=>x.id===id);if(p)openModal(`<h2>Editar produto</h2>${productForm(p)}`)};
window.excluirProduto=id=>{if(db.listas.some(l=>l.itens.some(i=>i.produto_id===id))){toast('Produto usado em lista; inative em vez de excluir');return}if(confirm('Excluir este produto?')){db.produtos=db.produtos.filter(p=>p.id!==id);closeModal();save();toast('Produto excluído')}};
window.abrirExclusaoProdutos=()=>{if(activeMembership?.papel!=='admin'){toast('Somente o administrador pode excluir produtos');return}const usados=new Set(db.listas.flatMap(l=>l.itens.map(i=>i.produto_id)));openModal(`<div class="split"><div><h2>Excluir produtos</h2><div class="row-sub">Selecione os cadastros que deseja remover</div></div><span class="badge danger">Administrador</span></div><div class="toolbar"><button class="ghost" onclick="marcarProdutosExclusao(true)">Selecionar todos permitidos</button><button class="ghost" onclick="marcarProdutosExclusao(false)">Desmarcar todos</button></div><div class="note">Produtos usados em listas ou contagens ficam protegidos e não podem ser apagados.</div><div class="list modal-list">${db.produtos.map(p=>`<label class="check-row"><input class="delete-product-check" type="checkbox" value="${p.id}" ${usados.has(p.id)?'disabled':''}><span><b>${esc(p.nome)}</b><div class="row-sub">${esc(p.codigo||'Sem código')} · ${esc(lojaName(p.loja_id))}${usados.has(p.id)?' · protegido por lista/contagem':''}</div></span></label>`).join('')||'<div class="empty">Nenhum produto cadastrado.</div>'}</div><div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="danger" onclick="confirmarExclusaoProdutos()">Excluir selecionados</button></div>`)};
window.marcarProdutosExclusao=marcar=>document.querySelectorAll('.delete-product-check:not(:disabled)').forEach(c=>c.checked=marcar);
window.confirmarExclusaoProdutos=()=>{if(activeMembership?.papel!=='admin'){toast('Ação não autorizada');return}const ids=[...document.querySelectorAll('.delete-product-check:checked')].map(c=>c.value);if(!ids.length){toast('Selecione pelo menos um produto');return}if(!confirm(`Excluir definitivamente ${ids.length} produto(s)? Esta ação não pode ser desfeita.`))return;db.produtos=db.produtos.filter(p=>!ids.includes(p.id));db.movimentos=db.movimentos.filter(m=>!ids.includes(m.produto_id));closeModal();save();registrarUso('produtos_excluidos',{quantidade:ids.length});toast(`${ids.length} produto(s) excluído(s)`) };

window.gerenciarCategorias=()=>openModal(`<div class="split"><h2>Categorias</h2><button class="btn" onclick="novaCategoria()">+ Categoria</button></div><div class="list modal-list">${db.categorias.map(c=>`<div class="row"><div><b>${esc(c.nome)}</b><div class="row-sub">ERP: ${esc(c.erp_id||'-')}</div></div><button class="mini" onclick="editarCategoria('${c.id}')">Editar</button></div>`).join('')||'<div class="empty">Nenhuma categoria.</div>'}</div><div class="actions"><button class="ghost" onclick="closeModal()">Fechar</button></div>`);
window.novaCategoria=()=>openModal(`<h2>Nova categoria</h2>${categoryForm()}`);

function categoryForm(c={}){return `<form id="categoriaForm" data-id="${c.id||''}" class="form-grid"><label>Nome<input name="nome" required value="${esc(c.nome||'')}"></label><label>ID ERP<input name="erp_id" value="${esc(c.erp_id||'')}"></label><label class="switch-line"><input name="ativo" type="checkbox" ${c.ativo!==false?'checked':''}> Categoria ativa</label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">Cancelar</button><button class="btn">Salvar</button></div></form>`}

function listas(){const podeCriar=!['contador','auditor'].includes(activeMembership?.papel);return `<div class="section-head"><h2>Listas de inventário</h2></div><div class="list">${db.listas.length?db.listas.map(l=>`<div class="row clickable" onclick="abrirLista('${l.id}')"><div><div class="row-title">${esc(l.nome)}</div><div class="row-sub">${l.itens.length} itens • ${new Date(l.criado_em).toLocaleDateString('pt-BR')}</div></div><span class="badge ${l.status==='finalizada'?'ok':'warn'}">${esc(l.status)}</span></div>`).join(''):'<div class="empty">Nenhuma lista disponível para contagem.</div>'}</div>${podeCriar?'<button class="fab" onclick="novaLista()">+</button>':''}`}
window.novaLista=()=>{if(['contador','auditor'].includes(activeMembership?.papel)){toast('Seu perfil não pode criar listas');return}if(!db.produtos.length){toast('Cadastre produtos primeiro');return}openModal(`<h2>Nova lista</h2><form id="listaForm" class="form-grid"><label>Nome da lista<input name="nome" required placeholder="Ex.: Inventário Loja Centro"></label><label>Descrição<textarea name="descricao" rows="2"></textarea></label><div><b>Produtos</b><div class="note">Selecione os itens que farão parte desta lista.</div>${db.produtos.filter(p=>p.ativo).map(p=>`<label class="check-row"><input type="checkbox" name="produto" value="${p.id}"><span><b>${esc(p.nome)}</b><div class="row-sub">${esc(p.codigo||'Sem código')} • saldo ${fmtQty(p.estoque_atual)}</div></span></label>`).join('')}</div><div class="actions"><button type="button" class="ghost" onclick="closeModal()">Cancelar</button><button class="btn">Criar lista</button></div></form>`)};

function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return [];const delim=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const parseLine=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out};const headers=parseLine(lines[0]).map(h=>h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''));return lines.slice(1).map(line=>{const cols=parseLine(line),o={};headers.forEach((h,i)=>o[h]=cols[i]??'');return o})}
function pick(o,names){for(const n of names)if(o[n]!==undefined&&o[n]!=='')return o[n];return ''}
function importERP(rows,fileName='erp.csv'){
 const novosEstimados=rows.filter(r=>{const codigo=String(pick(r,['codigo','sku','cod_produto','produto_codigo'])).trim(),erpId=String(pick(r,['erp_id','id_produto','produto_id','codigo_erp'])).trim();return !db.produtos.some(x=>(erpId&&x.erp_id===erpId)||(codigo&&x.codigo?.toLowerCase()===codigo.toLowerCase()))}).length;
 if(limiteAtingido('produtos',db.produtos.length,novosEstimados))return;
 let inserted=0,updated=0,rejected=0,cats=0;
 for(const r of rows){const codigo=String(pick(r,['codigo','sku','cod_produto','produto_codigo'])).trim(),nome=String(pick(r,['nome','produto','descricao_produto','produto_nome'])).trim(),erpId=String(pick(r,['erp_id','id_produto','produto_id','codigo_erp'])).trim();if(!codigo&&!erpId||!nome){rejected++;continue}const catNome=String(pick(r,['categoria','categoria_nome','grupo','departamento'])).trim(),catErp=String(pick(r,['categoria_id','id_categoria','categoria_erp_id'])).trim();let categoria=null;if(catNome||catErp){categoria=db.categorias.find(c=>(catErp&&c.erp_id===catErp)||(catNome&&c.nome.toLowerCase()===catNome.toLowerCase()));if(!categoria){categoria={id:uid(),erp_id:catErp,nome:catNome||`Categoria ${catErp}`,ativo:true,criado_em:now(),atualizado_em:now()};db.categorias.push(categoria);cats++}else if(catNome&&categoria.nome!==catNome){categoria.nome=catNome;categoria.atualizado_em=now()}}
 let p=db.produtos.find(x=>(erpId&&x.erp_id===erpId)||(codigo&&x.codigo?.toLowerCase()===codigo.toLowerCase()));const patch={erp_id:erpId||p?.erp_id||'',codigo:codigo||p?.codigo||'',nome,descricao:String(pick(r,['descricao','detalhes']))||p?.descricao||'',unidade:String(pick(r,['unidade','un','und']))||p?.unidade||'UN',categoria_id:categoria?.id||p?.categoria_id||'',setor:String(pick(r,['setor','secao','area','deposito']))||p?.setor||'',estoque_atual:num(pick(r,['estoque','estoque_atual','saldo','quantidade','qtd_estoque'])),estoque_minimo:num(pick(r,['estoque_minimo','minimo','qtd_minima'])),custo:num(pick(r,['custo','preco_custo','valor_custo'])),preco:num(pick(r,['preco','preco_venda','valor_venda'])),localizacao:String(pick(r,['localizacao','endereco_estoque','rua_prateleira']))||p?.localizacao||'',ativo:String(pick(r,['ativo','status'])).toLowerCase()!=='inativo',atualizado_em:now()};if(p){Object.assign(p,patch);updated++}else{db.produtos.push({id:uid(),...patch,criado_em:now()});inserted++}}
 db.importacoes.push({id:uid(),arquivo:fileName,inseridos:inserted,atualizados:updated,rejeitados:rejected,categorias_criadas:cats,criado_em:now()});save();toast(`ERP: ${inserted} novos, ${updated} atualizados, ${rejected} rejeitados`)
}

function guia(){return `<section class="hero"><div class="hero-kicker">GUIA DO USUÁRIO</div><h2>Do arquivo ao relatório de divergências.</h2><p>Use este roteiro para importar os dados, preparar a lista e concluir as duas contagens com segurança.</p></section><div class="list" style="margin-top:14px"><article class="card"><h3>1. Importar dados</h3><p class="note">Prefira CSV ou TXT exportado do ERP. Confira se a descrição está preenchida, se o código/SKU identifica o produto e se o estoque está numérico. Faça uma cópia do arquivo original antes de importar.</p><p class="note"><b>Cuidados:</b> não misture lojas sem identificar a coluna Loja; confira separador, acentos, casas decimais, datas e duplicidades. O sistema faz upsert pelo código.</p></article><article class="card"><h3>2. Criar uma lista</h3><p class="note">Abra <b>Listas</b>, escolha <b>Nova lista</b>, dê um nome com loja e data e selecione apenas os produtos que serão contados. Revise os itens antes de iniciar.</p></article><article class="card"><h3>3. Contagem 01</h3><p class="note">O contador informa as quantidades sem ver o estoque do sistema. Finalize somente depois de revisar todos os itens. A divergência fica aguardando a liberação do administrador.</p></article><article class="card"><h3>4. Contagem 02</h3><p class="note">O administrador libera a segunda contagem quando houver divergência. O contador refaz somente os itens divergentes, informa a justificativa e finaliza.</p></article><article class="card"><h3>5. Relatório de divergências</h3><p class="note">Após a segunda contagem, consulte os grupos <b>Faltas</b>, <b>Sobras</b> e <b>Não contados</b>. Revise as justificativas e exporte o relatório/PDF para assinatura e arquivo.</p></article><article class="card"><h3>Boas práticas</h3><p class="note">Importe primeiro em uma loja de teste, valide alguns produtos manualmente e só depois execute a contagem oficial. Não exclua produtos usados em listas; inative-os quando necessário.</p></article></div>`}

 localStorage.setItem(`${DB_KEY_BASE}:empresa:${currentUser.id}`,membership.empresa_id);
 companySelect.innerHTML=memberships.map(m=>`<option value="${m.empresa_id}" ${m.empresa_id===membership.empresa_id?'selected':''}>${esc(m.empresas.nome)} · ${papelNome(m.papel)}</option>`).join('');
 manageCompanyBtn.classList.toggle('hidden',membership.papel!=='admin');usagePanelBtn.classList.toggle('hidden',membership.papel!=='admin');plansBtn.classList.toggle('hidden',membership.papel!=='admin');storesBtn.classList.toggle('hidden',membership.papel!=='admin'||!empresarial());document.querySelectorAll('.nav-item').forEach(b=>{const permitidas=['contador','auditor'].includes(membership.papel)?['produtos','listas','contagens']:null;b.classList.toggle('hidden',permitidas&&!permitidas.includes(b.dataset.view))});if(['contador','auditor'].includes(membership.papel)&&!['produtos','listas','contagens'].includes(view))view='listas';document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();registrarUso('acesso',{tela:view,plano:activePlan.codigo});
}
companySelect.onchange=()=>{const m=memberships.find(x=>x.empresa_id===companySelect.value);if(m)useCompany(m)};
async function enterAccount(user){
 currentUser=user;authScreen.classList.add('hidden');appShell.classList.add('hidden');onboardingScreen.classList.add('hidden');
 document.getElementById('userChip').textContent=user.user_metadata?.full_name||user.email||'Usuário';
 const {error:profileError}=await supa.from('usuarios').upsert({id:user.id,nome:user.user_metadata?.full_name||user.user_metadata?.name||'',email:(user.email||'').toLowerCase()},{onConflict:'id'});if(profileError)console.warn(profileError.message);
 try{await loadMemberships()}catch(error){authScreen.classList.remove('hidden');authMessage('Não foi possível carregar suas empresas: '+error.message);return}
 if(!memberships.length){onboardingScreen.classList.remove('hidden');return}
 appShell.classList.remove('hidden');const saved=localStorage.getItem(`${DB_KEY_BASE}:empresa:${user.id}`);useCompany(memberships.find(m=>m.empresa_id===saved)||memberships[0]);
}
document.getElementById('companyForm').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('companyStatus');status.textContent='Criando empresa...';status.style.color='var(--ok)';const nome=document.getElementById('companyName').value.trim(),documento=document.getElementById('companyDocument').value.trim()||null;const {error}=await supa.from('empresas').insert({nome,documento,criado_por:currentUser.id});if(error){status.textContent=error.message;status.style.color='var(--danger)';return}await enterAccount(currentUser)};
window.gerenciarEmpresa=async()=>{
 const {data:members,error}=await supa.from('empresa_usuarios').select('usuario_id,papel,ativo,loja,setor,usuarios(nome,email,telefone)').eq('empresa_id',activeMembership.empresa_id).order('criado_em');
 if(error){toast('Não foi possível carregar os usuários');return}
 openModal(`<div class="split"><div><h2>Usuários da empresa</h2><div class="row-sub">${esc(activeMembership.empresas.nome)}</div></div><span class="badge ok">Administrador</span></div><div class="list modal-list">${(members||[]).map(m=>`<div class="row"><div><b>${esc(m.usuarios?.nome||m.usuarios?.email||'Usuário')}</b><div class="row-sub">${esc(m.usuarios?.email||'')} · ${esc(m.usuarios?.telefone||'Sem telefone')}</div><div class="row-sub">${papelNome(m.papel)} · ${esc(m.loja||'Loja não informada')} · ${esc(m.setor||'Setor não informado')}</div></div><span class="badge ${m.ativo?'ok':'warn'}">${m.ativo?'Ativo':'Inativo'}</span></div>`).join('')||'<div class="empty">Nenhum usuário.</div>'}</div><form id="memberForm" class="form-grid"><h3>Criar acesso de contador ou auditor</h3><div class="row-sub">O contador executa contagens. O auditor consulta listas, saldos e resultados sem fazer alterações.</div><div class="two"><label>Nome completo<input name="nome" required minlength="2" maxlength="120" autocomplete="name" placeholder="Nome do usuário"></label><label>E-mail<input name="email" type="email" required autocomplete="email" placeholder="usuario@empresa.com"></label></div><div class="two"><label>Telefone<input name="telefone" type="tel" required minlength="8" maxlength="30" autocomplete="tel" placeholder="(11) 99999-9999"></label><label>Senha inicial<input name="senha" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label></div><div class="two"><label>Perfil<select name="papel" required><option value="contador">Contador</option><option value="auditor">Auditor</option></select></label><label>Loja<input name="loja" maxlength="120" placeholder="Ex.: Loja Centro"></label></div><label>Setor<input name="setor" maxlength="120" placeholder="Ex.: Depósito, Mercearia ou Auditoria"></label><div class="note">Informe pelo menos a loja ou o setor. A senha é enviada com segurança ao Supabase e não fica salva no aplicativo.</div><div class="actions"><button type="button" class="ghost" onclick="closeModal()">Fechar</button><button class="btn">Criar usuário</button></div></form>`);
 document.getElementById('memberForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button[type="submit"],button.btn'),original=button.textContent;button.disabled=true;button.textContent='Criando...';try{const f=new FormData(e.target),payload=Object.fromEntries(f.entries());if(!String(payload.loja||'').trim()&&!String(payload.setor||'').trim())throw new Error('Informe pelo menos a loja ou o setor');const {data:{session}}=await supa.auth.getSession();const response=await fetch(`${SUPABASE_URL}/functions/v1/admin-criar-usuario`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${session?.access_token||''}`},body:JSON.stringify({empresa_id:activeMembership.empresa_id,...payload})});const data=await response.json().catch(()=>({}));if(!response.ok||data.error)throw new Error(data.error||'Não foi possível criar o usuário');toast('Usuário criado com sucesso');gerenciarEmpresa()}catch(err){toast(err.message||'Não foi possível criar o usuário');button.disabled=false;button.textContent=original}};
};
window.gerenciarLojasAuditoria=async()=>{
 if(!empresarial()){toast('Disponível exclusivamente no plano Empresarial');return}
 const {data:members,error}=await supa.from('empresa_usuarios').select('usuario_id,papel,ativo,usuarios(nome,email)').eq('empresa_id',activeMembership.empresa_id).eq('ativo',true).in('papel',['auditor','contador']);
 if(error){toast('Não foi possível carregar a equipe');return}
 const equipe=members||[];
 openModal(`<div class="split"><div><h2>Lojas e auditoria</h2><div class="row-sub">Produtos, estoque e responsáveis separados por loja</div></div><span class="badge ok">Plano Empresarial</span></div><div class="list modal-list">${db.lojas.map(l=>`<div class="card"><div class="split"><div><b>${esc(l.nome)}</b><div class="row-sub">${esc(l.codigo||'Sem código')} · ${esc(l.localizacao||'Local não informado')}</div></div><span class="badge ${l.ativo?'ok':'warn'}">${l.ativo?'Ativa':'Inativa'}</span></div><div class="row-sub" style="margin-top:8px">Responsáveis pela contagem</div>${equipe.length?equipe.map(m=>`<label class="check-row"><input type="checkbox" ${l.auditor_ids?.includes(m.usuario_id)?'checked':''} onchange="atribuirAuditor('${l.id}','${m.usuario_id}',this.checked)"><span><b>${esc(m.usuarios?.nome||m.usuarios?.email||'Usuário')}</b><div class="row-sub">${papelNome(m.papel)} · ${esc(m.usuarios?.email||'')}</div></span></label>`).join(''):'<div class="note">Cadastre contadores ou auditores no menu Usuários.</div>'}</div>`).join('')}</div><form id="lojaForm" class="form-grid"><h3>Adicionar loja</h3><div class="two"><label>Nome<input name="nome" required maxlength="120" placeholder="Ex.: Loja Centro"></label><label>Código<input name="codigo" required maxlength="30" placeholder="Ex.: LJ-02"></label></div><label>Localização<input name="localizacao" maxlength="160" placeholder="Cidade, endereço ou filial"></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">Fechar</button><button class="btn">Cadastrar loja</button></div></form>`);
 document.getElementById('lojaForm').onsubmit=e=>{e.preventDefault();const limite=activePlan?.limite_lojas;if(limite!==null&&limite!==undefined&&db.lojas.length>=limite){toast(`Seu plano permite até ${limite} loja(s)`);return}const f=new FormData(e.target),codigo=String(f.get('codigo')||'').trim().toUpperCase();if(db.lojas.some(l=>l.codigo===codigo)){toast('Código de loja já cadastrado');return}db.lojas.push({id:uid(),nome:String(f.get('nome')||'').trim(),codigo,localizacao:String(f.get('localizacao')||'').trim(),auditor_ids:[],ativo:true,criado_em:now()});save(false);registrarUso('loja_criada',{codigo});gerenciarLojasAuditoria();toast('Loja cadastrada')}
};
window.atribuirAuditor=(lojaId,userId,checked)=>{const loja=db.lojas.find(l=>l.id===lojaId);if(!loja)return;if(checked){const limite=activePlan?.limite_auditores,atuais=new Set(db.lojas.flatMap(l=>l.auditor_ids||[]));if(limite!==null&&limite!==undefined&&!atuais.has(userId)&&atuais.size>=limite){toast(`Seu plano permite até ${limite} responsável(is)`);gerenciarLojasAuditoria();return}}loja.auditor_ids||=[];loja.auditor_ids=checked?[...new Set([...loja.auditor_ids,userId])]:loja.auditor_ids.filter(id=>id!==userId);save(false);registrarUso('responsavel_loja_alterado',{loja_id:lojaId,usuario_id:userId,ativo:checked});toast(checked?'Responsável vinculado':'Responsável removido')};
storesBtn.onclick=()=>gerenciarLojasAuditoria();
manageCompanyBtn.onclick=()=>gerenciarEmpresa();
plansBtn.onclick=()=>abrirPlanos();

async function registrarUso(evento,detalhes={}){
 if(!currentUser||!activeMembership)return;
 const {error}=await supa.from('uso_eventos').insert({empresa_id:activeMembership.empresa_id,usuario_id:currentUser.id,evento,detalhes});
 if(error)console.warn('Uso não registrado:',error.message);
}
function dataCurta(iso){if(!iso)return 'Nunca';return new Date(iso).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
window.abrirPainelUso=async()=>{
 if(activeMembership?.papel!=='admin')return;
 openModal('<div class="usage-panel"><div class="split"><div><h2>Painel de usuários e uso</h2><div class="row-sub">'+esc(activeMembership.empresas.nome)+'</div></div><span class="badge ok">Administrador</span></div><div class="empty">Carregando indicadores...</div></div>');
 const inicio=new Date();inicio.setDate(inicio.getDate()-30);
 const [{data:members,error:memberError},{data:events,error:eventError}]=await Promise.all([
  supa.from('empresa_usuarios').select('usuario_id,papel,ativo,criado_em,usuarios(nome,email)').eq('empresa_id',activeMembership.empresa_id).eq('ativo',true).order('criado_em'),
  supa.from('uso_eventos').select('usuario_id,evento,detalhes,criado_em').eq('empresa_id',activeMembership.empresa_id).gte('criado_em',inicio.toISOString()).order('criado_em',{ascending:false}).limit(2000)
 ]);
 if(memberError||eventError){modalBody.innerHTML='<h2>Painel de uso</h2><div class="alert-card">Não foi possível carregar os indicadores: '+esc(memberError?.message||eventError?.message)+'</div><div class="actions"><button class="ghost" onclick="closeModal()">Fechar</button></div>';return}
 const agora=new Date(),inicioHoje=new Date(agora.getFullYear(),agora.getMonth(),agora.getDate()),inicio7=new Date(inicioHoje);inicio7.setDate(inicio7.getDate()-6);
 const hoje=events.filter(e=>new Date(e.criado_em)>=inicioHoje),ultimos7=events.filter(e=>new Date(e.criado_em)>=inicio7),ativos7=new Set(ultimos7.map(e=>e.usuario_id)).size,acessosHoje=hoje.filter(e=>e.evento==='acesso').length;
 const dias=Array.from({length:7},(_,i)=>{const d=new Date(inicio7);d.setDate(d.getDate()+i);const key=d.toISOString().slice(0,10);return {key,label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),qtd:events.filter(e=>new Date(e.criado_em).toISOString().slice(0,10)===key).length}}),max=Math.max(1,...dias.map(d=>d.qtd));
 const ultimoPorUsuario={};events.forEach(e=>{if(!ultimoPorUsuario[e.usuario_id])ultimoPorUsuario[e.usuario_id]=e.criado_em});
 modalBody.innerHTML=`<div class="usage-panel"><div class="split"><div><h2>Painel de usuários e uso</h2><div class="row-sub">${esc(activeMembership.empresas.nome)} · últimos 30 dias</div></div><span class="badge ok">Administrador</span></div>
 <div class="stats-strip"><div><b>${members.length}</b><span>Usuários ativos</span></div><div><b>${ativos7}</b><span>Ativos em 7 dias</span></div><div><b>${acessosHoje}</b><span>Acessos hoje</span></div></div>
 <h3>Atividade nos últimos 7 dias</h3><div class="usage-chart">${dias.map(d=>`<div class="usage-day"><b>${d.qtd}</b><div class="usage-bar" style="height:${Math.max(5,Math.round(d.qtd/max*100))}%"></div><small>${esc(d.label)}</small></div>`).join('')}</div>
 <div class="row-sub">${events.length} eventos registrados nos últimos 30 dias.</div><h3>Usuários</h3><div class="list">${members.map(m=>`<div class="row"><div><b>${esc(m.usuarios?.nome||m.usuarios?.email||'Usuário')}</b><div class="row-sub">${esc(m.usuarios?.email||'')} · Último uso: ${esc(dataCurta(ultimoPorUsuario[m.usuario_id]))}</div></div><span class="badge ${m.papel==='admin'?'ok':''}">${papelNome(m.papel)}</span></div>`).join('')||'<div class="empty">Nenhum usuário.</div>'}</div><div class="actions"><button class="ghost" onclick="closeModal()">Fechar</button></div></div>`;
 registrarUso('painel_visualizado');
};
usagePanelBtn.onclick=()=>abrirPainelUso();

supa.auth.onAuthStateChange((_event,session)=>{if(session?.user)enterAccount(session.user);else{currentUser=null;memberships=[];activeMembership=null;appShell.classList.add('hidden');onboardingScreen.classList.add('hidden');authScreen.classList.remove('hidden')}});
supa.auth.getSession().then(({data})=>{if(data.session?.user)enterAccount(data.session.user);else authScreen.classList.remove('hidden')});
window.setView=setView;window.closeModal=closeModal;
</script>
